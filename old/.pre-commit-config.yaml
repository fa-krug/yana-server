# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^parity/fixtures/
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.10
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
        exclude: ^.*/migrations/.*\.py$
      # Run the formatter.
      - id: ruff-format
        exclude: ^.*/migrations/.*\.py$

  # mypy and pytest run through `uv run` against the project's own locked
  # environment. Two reasons over the upstream mirrors-mypy hook:
  #   1. No duplicate dependency list to drift out of sync with pyproject.toml
  #      (the old one still carried lxml long after it stopped being used).
  #   2. No hardcoded interpreter path -- `venv/bin/pytest` broke when the
  #      project directory was renamed, because console-script shebangs bake in
  #      an absolute path. `uv run` resolves the environment every time.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy --config-file=pyproject.toml
        language: system
        types: [python]
        exclude: ^.*/migrations/.*\.py$

      - id: pytest
        name: Run all tests
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
