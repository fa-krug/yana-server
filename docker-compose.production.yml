# NOT what is deployed today. Production still runs the last image the Django
# pipeline published, and the live stack file lives in Portainer. This file is
# the target shape for when this app replaces it -- see the header of
# .github/workflows/ci.yml for why nothing publishes or deploys yet. The Django
# version of this file is kept at old/docker-compose.production.yml.
#
# No `qcluster` service: the job worker runs in-process, so a second container
# would run every job twice.

services:
  yana:
    image: ${DOCKER_USERNAME:-sascha384}/yana:latest
    container_name: yana
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/yana.db
      - HOSTNAME=0.0.0.0
      # `:?` so the stack refuses to come up rather than starting a container
      # that throws on its first authenticated request: Better Auth treats its
      # built-in development secret as a hard error when NODE_ENV=production,
      # because that shared default would let anyone forge a session cookie.
      # Generate with `openssl rand -base64 32`; rotating it logs everyone out.
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set a random 32+ byte secret}
      # WebAuthn is origin-bound. PASSKEY_RP_ID is the bare registrable domain
      # (no scheme, no port); PUBLIC_URL is the full origin, no trailing slash.
      # A mismatch with the host the browser shows makes the browser refuse the
      # credential with an error that names nothing, and changing PASSKEY_RP_ID
      # later invalidates every passkey already registered.
      - PASSKEY_RP_ID=${YANA_DOMAIN:-yana.fa-krug.de}
      - PUBLIC_URL=https://${YANA_DOMAIN:-yana.fa-krug.de}
      - BETTER_AUTH_URL=https://${YANA_DOMAIN:-yana.fa-krug.de}
    volumes:
      # Named volumes: they inherit the image's uid 1001 ownership, so SQLite can
      # create its -wal/-shm siblings without a host-side chown. No
      # staticfiles volume -- Next serves its own assets from the image.
      - yana-data:/app/data
      - yana-media:/app/media
    # /health, without a trailing slash: Django served /health/ and Next serves
    # /health, 308-redirecting the slashed form. wget comes from busybox in
    # node:25-alpine. The route runs a real SELECT against SQLite, so an
    # unhealthy container here means the database is unreachable, not just that
    # Node is down.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.yana.rule=Host(`${YANA_DOMAIN:-yana.fa-krug.de}`)"
      - "traefik.http.routers.yana.entrypoints=web"
      - "traefik.http.services.yana.loadbalancer.server.port=3000"

volumes:
  yana-data:
  yana-media:
