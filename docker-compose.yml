# Dev container for the built image. For day-to-day work use `npm run dev`
# instead -- this image is a production standalone build, so it does not reload.
#
# There is no `qcluster`-style second service: the job worker runs in-process,
# so a second container would run every job twice.

services:
  yana:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yana-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Both are pinned in the Dockerfile; repeated here so the values are
      # visible where you look for them.
      - DATABASE_PATH=/app/data/yana.db
      - HOSTNAME=0.0.0.0
    volumes:
      # Bind mounts, so the DB and images survive `docker compose down` and are
      # inspectable from the host. Docker does NOT chown a bind mount, and the
      # image runs as uid 1001 -- run `chown -R 1001:1001 ./data ./media` on the
      # host before the first start, or switch to named volumes (which do
      # inherit the image's ownership).
      - ./data:/app/data
      - ./media:/app/media
    # /health, without a trailing slash: Django served /health/ and Next serves
    # /health, 308-redirecting the slashed form. wget is available in the
    # runtime image via busybox (node:25-alpine), so no extra package is needed.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - yana-network

networks:
  yana-network:
    driver: bridge
