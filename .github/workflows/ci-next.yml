# Deliberately PR-only until phase 14 swaps the Django tree for this one.
#
# ci.yml (the Django pipeline) also pushes to
# `${{ secrets.DOCKERHUB_USERNAME }}/yana` with byte-identical
# docker/metadata-action tag rules (`main`, `latest`, `sha-<sha>`) and also
# redeploys the same Portainer stack. If this workflow also ran on push to
# main and also published/deployed, `publish-manifest` could assemble
# `:latest` from a Django amd64 layer and a Next arm64 layer (or vice versa),
# and `deploy` would then push that mixed image live via the shared stack.
#
# So: no `push` trigger, and no publish-manifest / deploy jobs. The `test`,
# build-amd64 and build-arm64 jobs stay -- and still build for real, just
# without pushing anywhere -- so the checks run and the Dockerfile keeps
# getting exercised on every PR. Do NOT restore the push trigger or the
# publish-manifest/deploy jobs (and do NOT just gate them with `if: false`)
# until phase 14 actually retires ci.yml -- until then, doing so reintroduces
# the tag and stack collision described above.
name: CI/CD (Next)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yana-next

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: yana-next/.nvmrc
        cache: npm
        cache-dependency-path: yana-next/package-lock.json

    # Fails on a stale lockfile rather than resolving something untested.
    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Format check
      run: npm run format:check

    - name: Type check
      run: npm run typecheck

    - name: Test
      run: npm test

  # Build AMD64 image (push:false -- see file header; no registry to push to
  # until phase 14).
  build-amd64:
    name: Build AMD64
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AMD64 (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./yana-next
          push: false
          cache-from: type=gha,scope=next-amd64
          cache-to: type=gha,mode=max,scope=next-amd64
          platforms: linux/amd64
          provenance: false

  # Build ARM64 image (push:false -- see file header; no registry to push to
  # until phase 14).
  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-24.04-arm
    needs: [test]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./yana-next
          push: false
          cache-from: type=gha,scope=next-arm64
          cache-to: type=gha,mode=max,scope=next-arm64
          platforms: linux/arm64
          provenance: false
