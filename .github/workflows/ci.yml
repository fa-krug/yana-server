# The only pipeline. A push to `main` builds, pushes
# `${{ secrets.DOCKERHUB_USERNAME }}/yana:latest`, and redeploys the shared
# Portainer stack. A pull request still only builds (`push: false`), so the
# Dockerfile is exercised without publishing anything.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/yana

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # Fails on a stale lockfile rather than resolving something untested.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: API docs drift check
        run: npm run docs:api:check

      - name: Test
        run: npm test

      # Nothing above this line ever *runs* the application, and this phase
      # produced two bundler-class regressions that only a running server
      # catches: the edge compilation of the instrumentation hook, which made
      # `next dev` answer 500 on every route while `next build` stayed green,
      # and the startup migration, which no unit test boots. The image jobs
      # below do run `npm run build` through the Dockerfile, so the gap is the
      # boot, not the build.
      #
      # Three requests, each proving something different:
      #   /health  the startup hook ran and migrated a database that did not
      #            exist -- it is a real SELECT against SQLite
      #   /login   a page renders end to end: root layout, next-intl, theme
      #   /        the proxy is wired and redirects an uncookied request
      #
      # `next dev` rather than `npm start`, deliberately: the IgnorePlugin that
      # the instrumentation test guards only matters in dev, because that is
      # the only mode that compiles the edge hook at all.
      - name: Dev boot smoke
        env:
          BETTER_AUTH_SECRET: ci-smoke-secret-not-used-outside-this-job
        run: |
          set -euo pipefail
          npm run dev > dev.log 2>&1 &
          dev=$!
          trap 'kill "$dev" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health > /dev/null; then break; fi
            kill -0 "$dev" 2>/dev/null || { echo "the dev server exited"; cat dev.log; exit 1; }
            sleep 1
          done
          curl -fsS http://localhost:3000/health | tee /dev/stderr | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = 307
          # Three 2xx/3xx answers only prove the *fatal* form of the class above.
          # A compilation that fails for one layer can leave the server serving
          # every route while the log carries the error -- which is the shape the
          # edge-hook regression took the first time. So the log is a check, not
          # just something to read: none of these strings may appear in it.
          # Both bundlers' wordings are covered, since the --webpack pin is one
          # edit away from being dropped.
          ! grep -qiE 'Ecmascript file had an error|Module not found|Failed to compile|UnhandledSchemeError|Cannot find module' dev.log
          cat dev.log

  # Build AMD64 image. Pushed only on a `push` event (never for a PR).
  build-amd64:
    name: Build AMD64
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-linux-amd64
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push AMD64
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=next-amd64
          cache-to: type=gha,mode=max,scope=next-amd64
          platforms: linux/amd64
          provenance: false

  # Build ARM64 image. Pushed only on a `push` event (never for a PR).
  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-24.04-arm
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-linux-arm64
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ARM64
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=next-arm64
          cache-to: type=gha,mode=max,scope=next-arm64
          platforms: linux/arm64
          provenance: false

  # Create multi-arch manifest and push to registry.
  publish-manifest:
    name: Publish Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while read -r tag; do
            if [ -z "$tag" ]; then continue; fi
            echo "Creating manifest for $tag"
            docker manifest create "$tag" \
              --amend "$tag-linux-amd64" \
              --amend "$tag-linux-arm64"
            docker manifest push "$tag"
          done

  # Deploy to Portainer (fetch current config and redeploy).
  deploy:
    name: Deploy to Portainer
    runs-on: ubuntu-latest
    needs: [publish-manifest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Redeploy Portainer stack
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_HOST }}
          API_KEY: ${{ secrets.PORTAINER_TOKEN }}
          ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
        run: |
          set -e

          echo "Fetching stack configuration..."
          STACK_RESPONSE=$(curl -sf -H "X-API-Key: $API_KEY" "$PORTAINER_URL/api/stacks/$STACK_ID")
          ENV_VARS=$(echo "$STACK_RESPONSE" | jq -c '.Env // []')
          WEBHOOK=$(echo "$STACK_RESPONSE" | jq -c '.Webhook // null')

          echo "Fetching stack file content..."
          FILE_RESPONSE=$(curl -sf -H "X-API-Key: $API_KEY" "$PORTAINER_URL/api/stacks/$STACK_ID/file")
          STACK_FILE_CONTENT=$(echo "$FILE_RESPONSE" | jq -r '.StackFileContent')

          echo "Redeploying stack..."
          PAYLOAD=$(jq -n \
            --arg content "$STACK_FILE_CONTENT" \
            --argjson env "$ENV_VARS" \
            --argjson webhook "$WEBHOOK" \
            --arg id "$STACK_ID" \
            '{StackFileContent: $content, Env: $env, Prune: true, PullImage: true, Webhook: $webhook, Id: $id}')

          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X PUT "$PORTAINER_URL/api/stacks/$STACK_ID?endpointId=$ENDPOINT_ID" \
            -H "X-API-Key: $API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Stack redeployed successfully!"
          elif [ "$HTTP_CODE" = "524" ]; then
            echo "Got 524 timeout, checking stack status..."
            CHECK_CODE=$(curl -s -o /tmp/check.txt -w "%{http_code}" -H "X-API-Key: $API_KEY" "$PORTAINER_URL/api/stacks/$STACK_ID")
            if [ "$CHECK_CODE" = "200" ]; then
              STATUS=$(cat /tmp/check.txt | jq -r '.Status')
              if [ "$STATUS" = "1" ]; then
                echo "Stack is running - deployment likely succeeded!"
              else
                echo "::warning::Stack status: $STATUS - may need attention"
              fi
            else
              echo "::error::Could not verify stack status: $CHECK_CODE"
              exit 1
            fi
          else
            echo "::error::Failed to redeploy stack (HTTP $HTTP_CODE)"
            exit 1
          fi
