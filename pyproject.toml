[project]
name = "yana"
version = "0.1.0"
description = "Django-based RSS aggregator and feed management system"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [{name = "Stefan Krug"}]

# Direct runtime dependencies only. Transitive dependencies are resolved and
# pinned in uv.lock -- do not list them here. Versions stay pinned so the lock
# reproduces the pre-uv environment exactly; loosen them deliberately later.
dependencies = [
    "Django==6.0",
    "Pillow==11.0.0",
    "beautifulsoup4==4.14.3",
    "feedparser==6.0.12",
    "requests==2.32.5",
    "markdown==3.10",
    "praw>=7.7.1",
    "django-environ==0.12.0",
    "django-q2==1.9.0",
    "django-autocomplete-light==3.12.1",
    "django-import-export==4.3.14",
    "djangoql==0.18.1",
    "gunicorn==21.2.0",
    "whitenoise==6.6.0",
    # 4.3.0, not 4.2.5: 4.2.5 imports pkg_resources, which setuptools removed in
    # 81. requirements.txt silently relied on its setuptools==80.9.0 pin to keep
    # that import working -- an undeclared coupling that broke as soon as
    # transitive versions were resolved fresh. 4.3.0 needs neither.
    "supervisor==4.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-django==4.11.1",
    "pytest-cov==7.0.0",
    "ruff==0.14.10",
    "mypy==1.19.1",
    "django-stubs==5.2.8",
    "pre-commit==4.5.1",
    "types-Markdown==3.10.0.20251106",
    "types-beautifulsoup4==4.12.0.20250516",
    "types-requests==2.32.4.20250913",
]

[tool.uv]
# Yana is an application, not a distributable package: there is no
# [build-system], so uv must not try to build and install the project itself.
package = false

[tool.ruff]
# Set the maximum line length to 100.
line-length = 100

# Assume Python 3.13
target-version = "py313"

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    "migrations",
    "staticfiles",
]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and pycodestyle (`E`, `W`) by default.
# Also enable:
# - isort (I) for import sorting
# - Django (DJ) for Django-specific checks
# - flake8-bugbear (B) for common bugs
# - flake8-simplify (SIM) for simplification suggestions
# - flake8-comprehensions (C4) for better comprehensions
# - flake8-django (DJ) for Django best practices
select = ["E", "F", "W", "I", "B", "SIM", "C4", "DJ"]

# Ignore specific rules if needed
ignore = [
    "E501",  # Line too long (handled by formatter)
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore import rules in __init__.py files
"__init__.py" = ["F401"]
# Ignore all checks in migrations
"migrations/*.py" = ["ALL"]

[tool.ruff.lint.isort]
# Use Django's import order
known-first-party = ["yana", "core"]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
"django" = ["django"]

[tool.ruff.format]
# Use double quotes for strings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"

# Respect magic trailing commas.
skip-magic-trailing-comma = false

# Automatically detect the appropriate line ending.
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "yana.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "yana.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov=core --cov-report=term-missing --reuse-db"
testpaths = ["core"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
